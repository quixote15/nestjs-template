services:
  postgres:
    image: postgres:17-alpine
    container_name: outbox-poc-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: outbox
      POSTGRES_PASSWORD: outbox
      POSTGRES_DB: outbox_poc
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      # The analytics service owns a database of its own (runs on a fresh volume only).
      - ./docker/init-analytics.sql:/docker-entrypoint-initdb.d/init-analytics.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U outbox -d outbox_poc"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
